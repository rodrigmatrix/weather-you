name: Upload WeatherYou to Google Play internal testing

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Next version code; must be greater than the highest version already uploaded to Play (and greater than 520066)."
        required: true
        type: string
      confirm_upload:
        description: "Upload the signed bundle to the Google Play internal test track."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: google-play-internal-release
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate internal release request
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.validate.outputs.proceed }}
    steps:
      - name: Validate confirmation, branch, and version code
        id: validate
        shell: bash
        env:
          REQUESTED_REF: ${{ github.ref }}
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$REQUESTED_REF" != "refs/heads/main" && "$REQUESTED_REF" != "refs/heads/dev" ]]; then
            echo "This workflow can upload only from main or dev. No release was sent to Google Play."
            exit 1
          fi
          if [[ "$CONFIRM_UPLOAD" != "true" ]]; then
            echo "Upload was not confirmed. No release was sent to Google Play."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$REQUESTED_VERSION_CODE" =~ ^[1-9][0-9]{5,9}$ ]]; then
            echo "version_code must be an integer without leading zeroes and contain 6 to 10 digits."
            exit 1
          fi
          if (( REQUESTED_VERSION_CODE <= 520066 )); then
            echo "version_code must be greater than the app's local fallback 520066."
            exit 1
          fi
          if (( REQUESTED_VERSION_CODE > 2100000000 )); then
            echo "version_code exceeds the supported Android version-code range."
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  upload-internal:
    name: Build and upload internal test bundle
    needs: validate-request
    if: ${{ needs.validate-request.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: google-play-internal
    env:
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build pinned ComposeCharts dependency
        shell: bash
        run: |
          set -euo pipefail
          compose_charts_dir="$(mktemp -d "$RUNNER_TEMP/composecharts.XXXXXX")"
          git -C "$compose_charts_dir" init
          git -C "$compose_charts_dir" remote add origin https://github.com/rodrigmatrix/ComposeCharts.git
          git -C "$compose_charts_dir" fetch --depth 1 origin 454b00e8a41d70c45b47e4e02b86494b69cdb335
          git -C "$compose_charts_dir" checkout --detach FETCH_HEAD
          (cd "$compose_charts_dir" && GRADLE_USER_HOME="$RUNNER_TEMP/gradle-composecharts" ./gradlew :compose-charts:assembleRelease)
          mkdir -p weather-you/features/locationdetails/libs
          cp "$compose_charts_dir/compose-charts/build/outputs/aar/compose-charts-release.aar" \
            weather-you/features/locationdetails/libs/compose-charts-android-1.0.aar

      - name: Prepare Google Play Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.WEATHER_YOU_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?Missing WEATHER_YOU_GOOGLE_SERVICES_JSON_BASE64 environment secret}"
          config_path="weather-you/app/src/googlePlay/google-services.json"
          mkdir -p "$(dirname "$config_path")"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$config_path"
          chmod 600 "$config_path"

      - name: Prepare upload signing key
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.WEATHER_YOU_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_ALIAS: ${{ secrets.WEATHER_YOU_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.WEATHER_YOU_UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.WEATHER_YOU_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${UPLOAD_KEYSTORE_BASE64:?Missing WEATHER_YOU_UPLOAD_KEYSTORE_BASE64 environment secret}"
          : "${UPLOAD_KEY_ALIAS:?Missing WEATHER_YOU_UPLOAD_KEY_ALIAS environment secret}"
          : "${UPLOAD_KEY_PASSWORD:?Missing WEATHER_YOU_UPLOAD_KEY_PASSWORD environment secret}"
          : "${UPLOAD_STORE_PASSWORD:?Missing WEATHER_YOU_UPLOAD_STORE_PASSWORD environment secret}"

          key_path="$RUNNER_TEMP/weather-you-upload-key.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          export WEATHER_YOU_CI_KEY_PATH="$key_path"

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value: str) -> str:
              escaped = []
              for char in value:
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char == "\n":
                      escaped.append("\\n")
                  elif char == "\r":
                      escaped.append("\\r")
                  elif char == "\t":
                      escaped.append("\\t")
                  elif char in " :=#!":
                      escaped.append("\\" + char)
                  else:
                      escaped.append(char)
              return "".join(escaped)

          properties = {
              "releaseKeyAlias": os.environ["UPLOAD_KEY_ALIAS"],
              "releaseKeyPassword": os.environ["UPLOAD_KEY_PASSWORD"],
              "releaseKeyStore": os.environ["WEATHER_YOU_CI_KEY_PATH"],
              "releaseStorePassword": os.environ["UPLOAD_STORE_PASSWORD"],
          }
          if any("\n" in value or "\r" in value for value in properties.values()):
              raise SystemExit("Signing properties must not contain newlines.")

          path = Path("weather-you/keystore.properties")
          path.write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in properties.items()),
              encoding="utf-8",
          )
          path.chmod(0o600)
          PY

      - name: Build Google Play release bundle
        working-directory: weather-you
        shell: bash
        env:
          WEATHERKIT_TOKEN: ${{ secrets.WEATHERKIT_TOKEN }}
          WEATHERKIT_ID: ${{ secrets.WEATHERKIT_ID }}
          WEATHERKIT_KID: ${{ secrets.WEATHERKIT_KID }}
          WEATHERKIT_ISS: ${{ secrets.WEATHERKIT_ISS }}
          WEATHERKIT_SUB: ${{ secrets.WEATHERKIT_SUB }}
        run: |
          set -euo pipefail
          : "${WEATHERKIT_TOKEN:?Missing WEATHERKIT_TOKEN environment secret}"
          : "${WEATHERKIT_ID:?Missing WEATHERKIT_ID environment secret}"
          : "${WEATHERKIT_KID:?Missing WEATHERKIT_KID environment secret}"
          : "${WEATHERKIT_ISS:?Missing WEATHERKIT_ISS environment secret}"
          : "${WEATHERKIT_SUB:?Missing WEATHERKIT_SUB environment secret}"
          if [[ ! "$WEATHERKIT_TOKEN" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "WEATHERKIT_TOKEN must be single-line Base64."
            exit 1
          fi
          bash ./gradlew --no-daemon :app:bundleGooglePlayRelease

      - name: Verify Google Play bundle exists
        shell: bash
        run: test -s weather-you/app/build/outputs/bundle/googlePlayRelease/app-googlePlay-release.aab

      - name: Authenticate to Google Cloud using GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WEATHER_YOU_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Upload bundle to internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.google-auth.outputs.credentials_file_path }}
          packageName: com.rodrigmatrix.weatheryou
          releaseFiles: weather-you/app/build/outputs/bundle/googlePlayRelease/app-googlePlay-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ github.ref_name }}-${{ inputs.version_code }}

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f weather-you/app/src/googlePlay/google-services.json
          rm -f weather-you/keystore.properties
          rm -f "$RUNNER_TEMP/weather-you-upload-key.jks"
