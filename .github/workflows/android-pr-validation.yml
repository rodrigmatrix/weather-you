name: Android PR validation

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and F-Droid debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build pinned ComposeCharts dependency
        shell: bash
        run: |
          set -euo pipefail
          compose_charts_dir="$(mktemp -d "$RUNNER_TEMP/composecharts.XXXXXX")"
          git -C "$compose_charts_dir" init
          git -C "$compose_charts_dir" remote add origin https://github.com/rodrigmatrix/ComposeCharts.git
          git -C "$compose_charts_dir" fetch --depth 1 origin 454b00e8a41d70c45b47e4e02b86494b69cdb335
          git -C "$compose_charts_dir" checkout --detach FETCH_HEAD
          (cd "$compose_charts_dir" && GRADLE_USER_HOME="$RUNNER_TEMP/gradle-composecharts" ./gradlew :compose-charts:assembleRelease)
          mkdir -p weather-you/features/locationdetails/libs
          cp "$compose_charts_dir/compose-charts/build/outputs/aar/compose-charts-release.aar" \
            weather-you/features/locationdetails/libs/compose-charts-android-1.0.aar

      - name: Run data and widget tests and build app
        working-directory: weather-you
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon \
            :data:testDebugUnitTest \
            :features:widgets:testDebugUnitTest \
            :features:widgets:compileDebugKotlin \
            :app:assembleFDroidDebug
